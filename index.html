<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burrow Field Fixtures</title>
  <style>
    body { margin: 0; background: #f3f4f6; font-family: Arial, Helvetica, sans-serif; color: #172033; }
    .header { background: #123b25; color: white; padding: 28px 20px; }
    .header-inner { max-width: 1000px; margin: auto; }
    h1 { margin: 0 0 6px; font-size: 28px; }
    .subtitle { margin: 0; opacity: .9; }
    .container { max-width: 1000px; margin: 25px auto; padding: 0 15px; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    .fixture { border-bottom: 1px solid #e5e7eb; padding: 18px 0; }
    .fixture:last-child { border-bottom: 0; }
    .date { color: #123b25; font-weight: bold; margin-bottom: 7px; }
    .teams { font-size: 18px; font-weight: bold; }
    .venue { margin-top: 8px; color: #555; }
    .competition { margin-top: 5px; color: #777; font-size: 14px; }
    .loading { text-align: center; padding: 30px; color: #666; }
    .error { color: #a00; padding: 20px 0; }
    @media (max-width: 600px) {
      .header { padding: 22px 15px; }
      h1 { font-size: 23px; }
      .card { padding: 15px; }
      .teams { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-inner">
      <h1>Burrow Field Fixtures</h1>
      <p class="subtitle">Upcoming fixtures at Burrow’s Field</p>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <div id="fixtures" class="loading">Loading fixtures…</div>
    </div>
  </div>

  <script>
    async function loadFixtures() {
      const container = document.getElementById("fixtures");

      try {
        const response = await fetch("fixtures.json?cache=" + Date.now());
        if (!response.ok) {
          throw new Error("Fixtures could not be loaded.");
        }

        const fixtures = await response.json();

        if (!fixtures.length) {
          container.innerHTML = "<p>No upcoming fixtures at Burrow’s Field are currently listed.</p>";
          return;
        }

        container.className = "";
        container.innerHTML = fixtures.map(f => `
          <div class="fixture">
            <div class="date">${escapeHtml(f.date)}${f.time ? " • " + escapeHtml(f.time) : ""}</div>
            <div class="teams">
              ${escapeHtml(f.home)} <span style="font-weight:normal">v</span> ${escapeHtml(f.away)}
            </div>
            <div class="venue">📍 ${escapeHtml(f.venue)}</div>
            ${f.competition ? `<div class="competition">${escapeHtml(f.competition)}</div>` : ""}
          </div>
        `).join("");
      } catch (error) {
        container.className = "error";
        container.innerHTML = "Sorry, the fixtures could not be loaded right now. Please try again later.";
      }
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadFixtures();
  </script>
</body>
</html>
