<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burrows Field Fixtures</title>
  <style>
    :root { --green:#123b25; --light:#f3f4f6; --border:#e5e7eb; --muted:#667085; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--light); font-family:Arial,Helvetica,sans-serif; color:#172033; }
    .header { background:var(--green); color:white; padding:28px 20px; }
    .header-inner,.container { max-width:1000px; margin:auto; }
    h1 { margin:0 0 6px; font-size:28px; }
    .subtitle { margin:0; opacity:.9; }
    .container { margin-top:25px; padding:0 15px; }
    .card { background:white; border-radius:12px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.08); overflow-x:auto; }
    .loading,.empty { text-align:center; padding:30px; color:var(--muted); }
    .error { color:#a00; padding:20px 0; }
    #lrep933106153 { width:100% !important; }
    #lrep933106153 table { width:100%; border-collapse:collapse; }
    #lrep933106153 th,#lrep933106153 td { padding:10px 8px; border-bottom:1px solid var(--border); text-align:left; }
    #lrep933106153 th { background:#f8fafc; font-weight:700; }
    #lrep933106153 a { color:var(--green); }
    @media (max-width:600px) {
      .header { padding:22px 15px; } h1 { font-size:23px; } .card { padding:15px; }
      #lrep933106153 { font-size:14px; }
      #lrep933106153 th,#lrep933106153 td { padding:8px 5px; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1>Burrows Field Fixtures</h1>
      <p class="subtitle">Upcoming fixtures at Burrows Field</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <div id="feed-status" class="loading">Loading fixtures from FA Full-Time…</div>

      <div id="lrep933106153" style="width:350px;">
        Data loading....<a href="https://fulltime.thefa.com/">Open FA Full-Time</a><br><br>
        <a href="https://www.thefa.com/FULL-TIME">FULL-TIME Home</a>
      </div>
      <script type="text/javascript">var lrcode = '933106153';</script>
      <script type="text/javascript" src="https://fulltime.thefa.com/client/api/cs1.js"></script>
    </section>
  </main>

  <script>
    const FEED_ID = 'lrep933106153';
    const VENUE_PATTERN = /burrows?(?:['’]s)?\s+field/i;
    const DATE_PATTERN = /\b\d{1,2}\/\d{1,2}\/\d{2,4}\b/;
    const status = document.getElementById('feed-status');
    const feed = document.getElementById(FEED_ID);

    function clean(text) {
      return (text || '').replace(/\s+/g, ' ').trim();
    }

    function filterFullTimeFeed() {
      if (!feed) return false;

      const rows = [...feed.querySelectorAll('tr')];
      if (!rows.length) return false;

      let fixturesSeen = 0;
      let matchingFixtures = 0;

      rows.forEach(row => {
        const text = clean(row.textContent);
        if (!DATE_PATTERN.test(text)) return;

        fixturesSeen++;
        if (VENUE_PATTERN.test(text)) {
          matchingFixtures++;
        } else {
          // Remove non-Burrows fixtures entirely. This is more reliable than
          // CSS hiding against the markup produced by the FA Full-Time feed.
          row.remove();
        }
      });

      if (fixturesSeen > 0) {
        status.className = matchingFixtures ? '' : 'empty';
        status.textContent = matchingFixtures
          ? `${matchingFixtures} upcoming fixture${matchingFixtures === 1 ? '' : 's'} at Burrows Field`
          : 'No upcoming fixtures at Burrows Field are currently listed.';
        return true;
      }

      return false;
    }

    // The FA feed renders asynchronously, so keep watching while it populates.
    const observer = new MutationObserver(() => filterFullTimeFeed());
    observer.observe(feed, { childList:true, subtree:true });

    let attempts = 0;
    const timer = setInterval(() => {
      attempts++;
      if (filterFullTimeFeed()) {
        setTimeout(() => observer.disconnect(), 5000);
        clearInterval(timer);
      } else if (attempts >= 60) {
        clearInterval(timer);
        observer.disconnect();
        status.className = 'error';
        status.innerHTML = 'The FA Full-Time feed has not returned fixture data. ' +
          '<a href="https://fulltime.thefa.com/" target="_blank" rel="noopener">Open the official FA Full-Time feed</a>.';
      }
    }, 500);
  </script>
</body>
</html>
